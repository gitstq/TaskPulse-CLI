[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskpulse-cli"
version = "1.0.0"
description = "🚀 终端智能任务调度器 - 让自动化触手可及"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "TaskPulse Team", email = "taskpulse@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "schedule>=1.2.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
taskpulse = "taskpulse.cli:main"
tp = "taskpulse.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/TaskPulse-CLI"
Repository = "https://github.com/gitstq/TaskPulse-CLI"
Issues = "https://github.com/gitstq/TaskPulse-CLI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["taskpulse*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
